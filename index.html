<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAILY WORK</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Google+Sans:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --sheet-ink:#202124; --sheet-border:#e1e3e6; --sheet-bar:#f8f9fa; --sheet-bar-line:#dadce0;
    --sheet-green:#0f9d58; --blue:#1a73e8; --paper:#ffffff; --muted:#5f6368; --muted-light:#9aa0a6;
    --font-ui:'Roboto','Hind Siliguri',sans-serif; --font-bn:'Hind Siliguri',sans-serif;

    /* column palette — matched to the reference sheet's header colors */
    --c-time:#23265c;      --c-time-soft:#eceafb;
    --c-daily:#1f6b46;     --c-daily-soft:#e4f3ea;
    --c-worktype:#c9791e;  --c-worktype-soft:#faecd9;
    --c-date:#3c2f7d;      --c-date-soft:#e9e6f8;
    --c-subject:#7a1f2e;   --c-subject-soft:#f7e6e8;
    --c-status:#1f6b46;    --c-status-soft:#e2f2ea;
    --c-finish:#c0392b;    --c-finish-soft:#f9e6e4;
    --c-total:#137a6f;     --c-total-soft:#e0f3f0;
    --c-rating:#1c3f7a;    --c-rating-soft:#e4ebf7;
    --c-opinion:#ad1a63;   --c-opinion-soft:#fbe3ee;
    --c-neutral:#eef0f3;   --c-neutral-line:#dadce0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#e8eaed;color:var(--sheet-ink);font-family:var(--font-bn);-webkit-font-smoothing:antialiased}
  button{font-family:var(--font-ui);cursor:pointer;background:none;border:none}
  .hidden{display:none !important}
  input,select,textarea{font-family:var(--font-bn)}

  /* ================= LOADING ================= */
  .page-loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-family:var(--font-ui);font-size:13px;letter-spacing:.03em}

  /* ================= LOGIN — simplified, minimal copy ================= */
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#eef1f5,#e3e7ee)}
  .login-card{width:100%;max-width:360px;background:#fff;border:1px solid var(--sheet-border);border-radius:12px;padding:36px 32px;box-shadow:0 2px 10px rgba(32,33,36,.08)}
  .login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px}
  .login-logo .mark{width:44px;height:44px;border-radius:10px;background:var(--sheet-green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700}
  .login-logo h1{font-family:var(--font-ui);font-size:18px;font-weight:500;margin:0;color:var(--sheet-ink)}

  .auth-toggle{display:flex;background:#f1f3f4;border-radius:8px;padding:3px;margin-bottom:20px}
  .auth-toggle button{flex:1;padding:8px 0;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
  .auth-toggle button.active{background:#fff;color:var(--sheet-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:12px;color:var(--muted)}
  .field input{border:1px solid var(--sheet-border);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--sheet-ink)}
  .field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.14)}
  .btn-solid{width:100%;background:var(--blue);color:#fff;border-radius:6px;padding:11px 0;font-size:14px;font-weight:600;margin-top:4px}
  .btn-solid:hover{background:#1558b0}
  .btn-solid:disabled{opacity:.55;cursor:not-allowed}
  .banner{padding:9px 12px;border-radius:6px;font-size:12.5px;margin-bottom:14px}
  .banner.error{background:#fce8e6;color:#c5221f}

  /* ================= APP SHELL — desktop Sheets chrome ================= */
  #app-screen{display:flex;flex-direction:column;height:100vh}

  .titlebar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--sheet-bar-line)}
  .titlebar .mark{width:34px;height:34px;border-radius:7px;background:var(--sheet-green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex:none}
  .titlebar .titles{display:flex;flex-direction:column}
  .titlebar .appname{font-family:var(--font-ui);font-size:16px;font-weight:500;color:var(--sheet-ink)}
  .titlebar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .avatar-btn{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:20px;transition:.15s}
  .avatar-btn:hover{background:#f1f3f4}
  .avatar-circle{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
  .avatar-name{font-size:13px;color:var(--sheet-ink)}
  .logout-menu{position:relative}
  .logout-dropdown{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--sheet-border);border-radius:8px;box-shadow:0 4px 16px rgba(32,33,36,.16);min-width:170px;padding:6px;z-index:50}
  .logout-dropdown button{width:100%;text-align:right;padding:9px 12px;font-size:13px;border-radius:6px;color:var(--sheet-ink)}
  .logout-dropdown button:hover{background:#f1f3f4}

  .sheet-area{flex:1;overflow:auto;background:#fff;position:relative}
  table.sheet{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%}

  table.sheet thead tr.col-letters th{
    position:sticky;top:0;z-index:7;background:var(--c-neutral);color:#70757a;
    font-family:'Roboto Mono',monospace;font-size:10.5px;font-weight:600;text-align:center;
    padding:5px 6px;border-right:1px solid var(--c-neutral-line);border-bottom:1px solid var(--c-neutral-line);
    min-width:130px;white-space:nowrap;
  }
  table.sheet thead tr.col-letters th.corner{position:sticky;left:0;top:0;z-index:9;min-width:64px}

  table.sheet thead tr.col-names th{
    position:sticky;top:26px;z-index:7;color:#fff;font-family:var(--font-bn);
    font-size:12px;font-weight:700;text-align:left;padding:9px 12px;
    border-right:1px solid rgba(255,255,255,.18);white-space:nowrap;
  }
  table.sheet thead tr.col-names th.corner{position:sticky;left:0;top:26px;z-index:9;background:var(--c-neutral);min-width:64px}
  table.sheet thead tr.col-names th.hd-neutral{background:var(--c-neutral);color:#3c4043}

  th.hd-time{background:var(--c-time)} th.hd-daily{background:var(--c-daily)}
  th.hd-worktype{background:var(--c-worktype)} th.hd-date{background:var(--c-date)}
  th.hd-subject{background:var(--c-subject)} th.hd-status{background:var(--c-status)}
  th.hd-finish{background:var(--c-finish)} th.hd-total{background:var(--c-total)}
  th.hd-rating{background:var(--c-rating)} th.hd-opinion{background:var(--c-opinion)}

  table.sheet tbody td{
    padding:0;border-right:1px solid var(--c-neutral-line);border-bottom:1px solid var(--c-neutral-line);
    white-space:nowrap;background:#fff;height:36px;vertical-align:middle;position:relative;
  }
  table.sheet tbody td .cellpad{padding:8px 12px;display:block;overflow:hidden;text-overflow:ellipsis}
  table.sheet tbody td.rownum{
    position:sticky;left:0;background:var(--c-neutral) !important;color:#70757a;font-family:'Roboto Mono',monospace;
    font-size:11px;text-align:center;font-weight:600;min-width:64px;z-index:3;border-right:1px solid var(--c-neutral-line)
  }
  table.sheet tbody tr.placeholder-row td{color:#bdc1c6;font-family:'Roboto Mono',monospace;font-size:11.5px}
  table.sheet tbody td.wrap .cellpad{white-space:normal;max-width:230px}

  td.tint-time{background:var(--c-time-soft)}
  td.tint-daily{background:var(--c-daily-soft)}
  td.tint-worktype{background:var(--c-worktype-soft)}
  td.tint-date{background:var(--c-date-soft)}
  td.tint-subject{background:var(--c-subject-soft)}
  td.tint-status{background:var(--c-status-soft)}
  td.tint-finish{background:var(--c-finish-soft)}
  td.tint-total{background:var(--c-total-soft)}
  td.tint-rating{background:var(--c-rating-soft)}
  td.tint-opinion{background:var(--c-opinion-soft)}

  /* decorative data-validation caret, matches the dropdown look in the reference sheet */
  td.has-caret .cellpad{padding-right:22px}
  td.has-caret::after{
    content:"▾";position:absolute;right:8px;top:50%;transform:translateY(-50%);
    font-size:9px;color:var(--muted-light);pointer-events:none;
  }

  /* the live entry row rendered inline inside the sheet */
  tr.entry-row td{background:#fffbe6 !important}
  tr.entry-row td.rownum{background:var(--sheet-green) !important;color:#fff}

  tr.entry-submit-row td{background:#f1f8f3 !important;padding:12px !important;border-right:none;text-align:center}
  .submit-full{
    width:100%;max-width:520px;background:var(--sheet-green);color:#fff;border-radius:8px;
    padding:13px 0;font-size:15px;font-weight:700;letter-spacing:.01em;box-shadow:0 2px 6px rgba(15,157,88,.35);transition:.15s;
  }
  .submit-full:hover{background:#0c8043}
  .submit-full:active{transform:scale(.98)}
  .submit-full:disabled{opacity:.6;cursor:not-allowed}

  /* floating submit button — always reachable regardless of scroll position */
  .fab-submit{
    position:fixed;right:24px;bottom:24px;z-index:40;background:var(--sheet-green);color:#fff;
    border-radius:999px;padding:13px 22px 13px 18px;display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:700;box-shadow:0 4px 14px rgba(15,157,88,.4);transition:.15s;
  }
  .fab-submit:hover{background:#0c8043;transform:translateY(-1px)}
  .fab-submit:active{transform:translateY(0)}
  .fab-submit .tick{font-size:16px}
  tr.entry-row input, tr.entry-row select{
    width:100%;border:none;background:transparent;font-size:12.5px;padding:8px 12px;color:var(--sheet-ink);
  }
  tr.entry-row input:focus, tr.entry-row select:focus{outline:2px solid var(--blue);outline-offset:-2px;background:#fff}
  tr.entry-row textarea{width:100%;border:none;background:transparent;font-size:12.5px;padding:8px 12px;color:var(--sheet-ink);resize:none;font-family:var(--font-bn)}
  tr.entry-row textarea:focus{outline:2px solid var(--blue);outline-offset:-2px;background:#fff}

  .status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .status-pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .status-pending{background:#fce8e6;color:#c5221f}
  .status-review{background:#fef3d9;color:#a8730a}
  .status-complete{background:#e6f4ea;color:#137333}
  .rating-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--c-rating);color:#fff}

  .sheet-tabs{display:flex;align-items:center;gap:2px;padding:6px 14px;background:var(--sheet-bar);border-top:1px solid var(--sheet-bar-line);font-size:12.5px;color:var(--muted)}
  .sheet-tabs .addtab{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center}
  .sheet-tabs .addtab:hover{background:#e8eaed}
  .tab-pill{padding:6px 14px;border-radius:6px 6px 0 0;background:#fff;color:var(--sheet-ink);font-weight:600;border-bottom:2px solid var(--sheet-green)}

  .below-sheet{padding:18px 24px 40px;background:#e8eaed}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:900px}
  .stat-tile{background:#fff;border:1px solid var(--sheet-border);border-radius:10px;padding:14px 16px}
  .stat-tile .num{font-family:var(--font-ui);font-size:22px;font-weight:700;color:var(--sheet-ink)}
  .stat-tile .label{font-size:10.5px;color:var(--muted);letter-spacing:.03em;margin-top:4px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:11px 20px;border-radius:6px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:60}
</style>
</head>
<body>

<div id="loading" class="page-loading">লোড হচ্ছে…</div>

<!-- ================= LOGIN ================= -->
<div id="login-screen" class="login-shell hidden">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">✓</div>
      <h1>DAILY WORK</h1>
    </div>

    <div class="auth-toggle">
      <button type="button" id="tab-login" class="active">লগইন</button>
      <button type="button" id="tab-signup">নতুন অ্যাকাউন্ট</button>
    </div>

    <div id="login-error" class="banner error hidden"></div>

    <form id="login-form">
      <div class="field"><label>ইমেইল</label><input type="email" id="login-email" required /></div>
      <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="login-password" required /></div>
      <button class="btn-solid" type="submit" id="login-btn">লগইন করুন</button>
    </form>

    <form id="signup-form" class="hidden">
      <div class="field"><label>পুরো নাম</label><input type="text" id="signup-name" required /></div>
      <div class="field"><label>ইমেইল</label><input type="email" id="signup-email" required /></div>
      <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="signup-password" minlength="6" required /></div>
      <button class="btn-solid" type="submit" id="signup-btn">অ্যাকাউন্ট তৈরি করুন</button>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-screen" class="hidden">

  <div class="titlebar">
    <div class="mark">✓</div>
    <div class="titles">
      <span class="appname">DAILY WORK</span>
    </div>
    <div class="titlebar-right">
      <div class="logout-menu">
        <button class="avatar-btn" id="avatar-btn">
          <span class="avatar-circle" id="avatar-initial">স</span>
          <span class="avatar-name" id="user-name"></span>
        </button>
        <div class="logout-dropdown hidden" id="logout-dropdown">
          <button id="logout-btn">লগআউট</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet-area">
    <table class="sheet">
      <thead>
        <tr class="col-letters">
          <th class="corner">#</th>
          <th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>G</th>
          <th>H</th><th>I</th><th>J</th><th>K</th><th>L</th><th>M</th>
        </tr>
        <tr class="col-names">
          <th class="corner"></th>
          <th class="hd-time">Edite Time M/S</th>
          <th class="hd-daily">Daily Work Time Hour</th>
          <th class="hd-worktype">Work Type</th>
          <th class="hd-date">Start Date</th>
          <th class="hd-date">End Date</th>
          <th class="hd-subject">Edite Subject</th>
          <th class="hd-status">Status</th>
          <th class="hd-finish">Finish Task</th>
          <th class="hd-neutral">Total Day,s</th>
          <th class="hd-total">Total Edite Time</th>
          <th class="hd-neutral">Total Hours</th>
          <th class="hd-rating">Monthly Ratting</th>
          <th class="hd-opinion">Person Opinion</th>
        </tr>
      </thead>
      <tbody id="sheet-body">
        <!-- entry row -->
        <tr class="entry-row">
          <td class="rownum">2</td>
          <td class="tint-time"><input type="number" min="0" step="0.1" id="f-edittime" placeholder="যেমনঃ ২.৫" /></td>
          <td class="tint-daily"><input type="number" min="0" step="0.5" id="f-hours" placeholder="যেমনঃ ৫" /></td>
          <td class="tint-worktype has-caret"><select id="f-worktype"><option>Editing</option><option>Design</option><option>Writing</option><option>Voice Over</option><option>Translation</option><option>অন্যান্য</option></select></td>
          <td class="tint-date"><input type="date" id="f-start" /></td>
          <td class="tint-date"><input type="date" id="f-end" /></td>
          <td class="tint-subject has-caret"><input type="text" id="f-subject" placeholder="বিষয় লিখুন" /></td>
          <td class="tint-status"><span class="cellpad" style="color:#9aa0a6;font-size:11.5px">Pending Review</span></td>
          <td class="tint-finish has-caret"><textarea rows="1" id="f-finishtask" placeholder="কাজের বিবরণ"></textarea></td>
          <td><span class="cellpad">—</span></td>
          <td class="tint-total"><span class="cellpad">—</span></td>
          <td><span class="cellpad">—</span></td>
          <td class="tint-rating"><span class="cellpad" style="color:#9aa0a6;font-size:11.5px">—</span></td>
          <td class="tint-opinion"><span class="cellpad">—</span></td>
        </tr>
        <tr class="entry-submit-row">
          <td colspan="14">
            <button type="button" id="submit-btn" class="submit-full">✓&nbsp; এই এন্ট্রি সাবমিট করুন</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="sheet-tabs">
    <button class="addtab" title="নতুন শিট">+</button>
    <span class="tab-pill">শিট ১</span>
  </div>

  <div class="below-sheet">
    <div id="submit-error" class="banner error hidden" style="max-width:900px"></div>
    <div class="stats-row" id="stats-row"></div>
  </div>
</div>

<button class="fab-submit hidden" id="fab-submit" title="নতুন এন্ট্রি সাবমিট করুন"><span class="tick">✓</span>সাবমিট করুন</button>
<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  updateProfile, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4OA9xJQd8xLLXDIdI5XckjsER8aRx9Do",
  authDomain: "daily-8b061.firebaseapp.com",
  projectId: "daily-8b061",
  storageBucket: "daily-8b061.firebasestorage.app",
  messagingSenderId: "151004750186",
  appId: "1:151004750186:web:5045d01ac5352c6b4f8513",
  measurementId: "G-D443DJF4HT",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

const COLS = 13; // A..M
const PLACEHOLDER_ROWS = 16;

function calcTotalDays(start, end) {
  if (!start || !end) return null;
  const d = Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
  return d > 0 ? d : null;
}
function mult(value, days) {
  if (!value || !days) return "";
  return (parseFloat(value) * days).toFixed(1);
}
function statusClass(status) {
  if (status === "Complete") return "status-complete";
  if (status === "In Review") return "status-review";
  return "status-pending";
}
function formatDate(d) {
  if (!d) return "dd/mm/yyyy";
  return new Date(d).toLocaleDateString("en-GB");
}
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.add("hidden"), 2600);
}

/* ---------- auth tab switching ---------- */
function showLoginPane() {
  $("tab-login").classList.add("active");
  $("tab-signup").classList.remove("active");
  $("login-form").classList.remove("hidden");
  $("signup-form").classList.add("hidden");
  $("login-error").classList.add("hidden");
}
function showSignupPane() {
  $("tab-signup").classList.add("active");
  $("tab-login").classList.remove("active");
  $("signup-form").classList.remove("hidden");
  $("login-form").classList.add("hidden");
  $("login-error").classList.add("hidden");
}
$("tab-login").addEventListener("click", showLoginPane);
$("tab-signup").addEventListener("click", showSignupPane);

$("avatar-btn").addEventListener("click", () => $("logout-dropdown").classList.toggle("hidden"));
document.addEventListener("click", (e) => {
  if (!e.target.closest(".logout-menu")) $("logout-dropdown").classList.add("hidden");
});

let unsubEntries = null;

onAuthStateChanged(auth, async (user) => {
  $("loading").classList.add("hidden");
  if (!user) {
    $("app-screen").classList.add("hidden");
    $("login-screen").classList.remove("hidden");
    $("fab-submit").classList.add("hidden");
    if (unsubEntries) unsubEntries();
    return;
  }

  let profile = { name: user.displayName || user.email, role: "staff" };
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) profile = snap.data();
  } catch (e) { console.error(e); }

  if (profile.role !== "staff" && profile.role !== "admin") {
    $("login-error").textContent = "আপনার অ্যাকাউন্টের জন্য কোনো রোল সেট করা নেই। ম্যানেজারের সাথে যোগাযোগ করুন।";
    $("login-error").classList.remove("hidden");
    await signOut(auth);
    return;
  }

  $("login-screen").classList.add("hidden");
  $("app-screen").classList.remove("hidden");
  $("fab-submit").classList.remove("hidden");
  const displayName = profile.name || user.email;
  $("user-name").textContent = displayName;
  $("avatar-initial").textContent = displayName.trim().charAt(0).toUpperCase();

  const q = query(collection(db, "entries"), where("uid", "==", user.uid), orderBy("createdAt", "desc"));
  unsubEntries = onSnapshot(q, (snap) => {
    const entries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderStats(entries);
    renderSheet(entries);
  });
});

function renderSheet(entries) {
  const body = $("sheet-body");
  // keep the entry row and its submit row (first two children), rebuild everything after them
  const entryRow = body.querySelector("tr.entry-row");
  const submitRow = body.querySelector("tr.entry-submit-row");
  body.innerHTML = "";
  body.appendChild(entryRow);
  body.appendChild(submitRow);

  let rowNum = 3;
  entries.forEach((e) => {
    const totalDays = calcTotalDays(e.startDate, e.endDate);
    const totalEditTime = mult(e.editTime, totalDays);
    const totalHours = mult(e.dailyHours, totalDays);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="rownum">${rowNum++}</td>
      <td class="tint-time"><span class="cellpad">${e.editTime ?? "—"}</span></td>
      <td class="tint-daily"><span class="cellpad">${e.dailyHours ?? "—"}</span></td>
      <td class="tint-worktype has-caret"><span class="cellpad">${e.workType || "—"}</span></td>
      <td class="tint-date"><span class="cellpad">${formatDate(e.startDate)}</span></td>
      <td class="tint-date"><span class="cellpad">${formatDate(e.endDate)}</span></td>
      <td class="tint-subject has-caret wrap"><span class="cellpad">${e.subject || "—"}</span></td>
      <td class="tint-status"><span class="cellpad"><span class="status-pill ${statusClass(e.status)}">${e.status}</span></span></td>
      <td class="tint-finish has-caret wrap"><span class="cellpad">${e.finishTask || "—"}</span></td>
      <td><span class="cellpad">${totalDays ?? "—"}</span></td>
      <td class="tint-total"><span class="cellpad">${totalEditTime || "—"}</span></td>
      <td><span class="cellpad">${totalHours || "—"}</span></td>
      <td class="tint-rating has-caret"><span class="cellpad">${e.monthlyRating ? `<span class="rating-pill">${e.monthlyRating}</span>` : "—"}</span></td>
      <td class="tint-opinion wrap"><span class="cellpad">${e.personOpinion || "—"}</span></td>
    `;
    body.appendChild(tr);
  });

  // trailing blank template rows, matching the empty look of a real sheet
  const caretCols = [3, 6, 8, 12]; // Work Type, Subject, Finish Task, Rating (0-indexed among data cols)
  const dateCols = [4, 5];
  for (let i = 0; i < PLACEHOLDER_ROWS; i++) {
    const tr = document.createElement("tr");
    tr.className = "placeholder-row";
    let tds = `<td class="rownum">${rowNum++}</td>`;
    for (let c = 0; c < COLS; c++) {
      const isDate = dateCols.includes(c);
      const isCaret = caretCols.includes(c);
      const tintClasses = ["tint-time","tint-daily","tint-worktype","tint-date","tint-date","tint-subject","tint-status","tint-finish","","tint-total","","tint-rating","tint-opinion"];
      const cls = `${tintClasses[c]}${isCaret ? " has-caret" : ""}`.trim();
      tds += `<td class="${cls}"><span class="cellpad">${isDate ? "dd/mm/yyyy" : ""}</span></td>`;
    }
    tr.innerHTML = tds;
    body.appendChild(tr);
  }
}

function renderStats(entries) {
  const pending = entries.filter((e) => e.status === "Pending Review").length;
  const review = entries.filter((e) => e.status === "In Review").length;
  const complete = entries.filter((e) => e.status === "Complete").length;
  const totalHrs = entries.reduce((sum, e) => {
    const d = calcTotalDays(e.startDate, e.endDate);
    const h = mult(e.dailyHours, d);
    return sum + (h ? parseFloat(h) : 0);
  }, 0);
  $("stats-row").innerHTML = `
    <div class="stat-tile"><div class="num">${entries.length}</div><div class="label">মোট এন্ট্রি</div></div>
    <div class="stat-tile"><div class="num">${pending}</div><div class="label">PENDING REVIEW</div></div>
    <div class="stat-tile"><div class="num">${review}</div><div class="label">IN REVIEW</div></div>
    <div class="stat-tile"><div class="num">${complete}</div><div class="label">COMPLETE</div></div>
    <div class="stat-tile"><div class="num">${totalHrs.toFixed(1)}</div><div class="label">মোট কর্মঘণ্টা</div></div>
  `;
}

/* ---------- login ---------- */
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-error").classList.add("hidden");
  $("login-btn").disabled = true;
  $("login-btn").textContent = "লগইন হচ্ছে…";
  try {
    await signInWithEmailAndPassword(auth, $("login-email").value, $("login-password").value);
  } catch (err) {
    $("login-error").textContent = "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।";
    $("login-error").classList.remove("hidden");
  } finally {
    $("login-btn").disabled = false;
    $("login-btn").textContent = "লগইন করুন";
  }
});

/* ---------- signup ---------- */
$("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-error").classList.add("hidden");
  $("signup-btn").disabled = true;
  $("signup-btn").textContent = "তৈরি হচ্ছে…";
  const name = $("signup-name").value.trim();
  const email = $("signup-email").value.trim();
  const password = $("signup-password").value;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, "users", cred.user.uid), { name, email, role: "staff", createdAt: serverTimestamp() });
  } catch (err) {
    let msg = "অ্যাকাউন্ট তৈরি করতে সমস্যা হয়েছে।";
    if (err.code === "auth/email-already-in-use") msg = "এই ইমেইল দিয়ে ইতিমধ্যে অ্যাকাউন্ট আছে।";
    if (err.code === "auth/weak-password") msg = "পাসওয়ার্ড কমপক্ষে ৬ ক্যারেক্টার হতে হবে।";
    if (err.code === "auth/invalid-email") msg = "সঠিক ইমেইল ঠিকানা দিন।";
    $("login-error").textContent = msg;
    $("login-error").classList.remove("hidden");
  } finally {
    $("signup-btn").disabled = false;
    $("signup-btn").textContent = "অ্যাকাউন্ট তৈরি করুন";
  }
});

$("logout-btn").addEventListener("click", () => signOut(auth));

/* ---------- submit entry: stays as a filled row in the sheet, a fresh empty row opens above it again ---------- */
async function submitEntry() {
  $("submit-error").classList.add("hidden");

  const editTime = $("f-edittime").value;
  const hours = $("f-hours").value;
  const start = $("f-start").value;
  const end = $("f-end").value;
  const subject = $("f-subject").value;

  if (!hours || !start || !end || !subject) {
    $("submit-error").textContent = "অনুগ্রহ করে সব প্রয়োজনীয় ঘর পূরণ করুন।";
    $("submit-error").classList.remove("hidden");
    $("submit-error").scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  if (new Date(end) < new Date(start)) {
    $("submit-error").textContent = "End date, Start date-এর আগে হতে পারবে না।";
    $("submit-error").classList.remove("hidden");
    return;
  }

  $("submit-btn").disabled = true;
  $("fab-submit").disabled = true;
  try {
    const user = auth.currentUser;
    const snap = await getDoc(doc(db, "users", user.uid));
    const profile = snap.exists() ? snap.data() : { name: user.email };

    await addDoc(collection(db, "entries"), {
      uid: user.uid,
      staffName: profile.name || user.email,
      editTime: editTime ? parseFloat(editTime) : null,
      dailyHours: parseFloat(hours),
      workType: $("f-worktype").value,
      startDate: start,
      endDate: end,
      subject: subject,
      finishTask: $("f-finishtask").value,
      status: "Pending Review",
      monthlyRating: null,
      personOpinion: "",
      createdAt: serverTimestamp(),
    });

    // the submitted entry now stays behind as a permanent sheet row (via the live listener),
    // while this entry row resets and stays open at the top, ready for the next entry.
    showToast("এন্ট্রি সাবমিট হয়েছে — এটি এখন শিটে যোগ হয়েছে");
    $("f-edittime").value = "";
    $("f-hours").value = "";
    $("f-start").value = "";
    $("f-end").value = "";
    $("f-subject").value = "";
    $("f-finishtask").value = "";
    $("f-worktype").selectedIndex = 0;
    $("f-edittime").focus();
  } catch (err) {
    console.error(err);
    $("submit-error").textContent = "সাবমিট করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।";
    $("submit-error").classList.remove("hidden");
  } finally {
    $("submit-btn").disabled = false;
    $("fab-submit").disabled = false;
  }
}

$("submit-btn").addEventListener("click", submitEntry);
$("fab-submit").addEventListener("click", submitEntry);

// pressing Enter inside any entry-row field also submits, like committing a row in a real sheet
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const el = e.target;
  if (!el.closest || !el.closest("tr.entry-row")) return;
  if (el.tagName === "TEXTAREA" && e.shiftKey) return; // allow shift+enter for a line break
  e.preventDefault();
  submitEntry();
});


</script>
